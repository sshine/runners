name: Build, push and test runner images

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        run: .forgejo/scripts/install-nix.sh

      - name: Build runner image
        run: nix run nixpkgs#just -- build

      - name: Push image to registry
        env:
          SKOPEO_DEST_CREDS: forgejo_admin:${{ secrets.RUNNERS_PACKAGE_UPLOAD_KEY }}
        run: nix run nixpkgs#just -- push

      - name: Push the fallback daemon image
        env:
          SKOPEO_DEST_CREDS: forgejo_admin:${{ secrets.RUNNERS_PACKAGE_UPLOAD_KEY }}
        run: nix run nixpkgs#just -- push-runner

      - name: Mirror the Kubernetes backend plugin
        env:
          SKOPEO_DEST_CREDS: forgejo_admin:${{ secrets.RUNNERS_PACKAGE_UPLOAD_KEY }}
        run: nix run nixpkgs#just -- mirror-plugin

  test-image:
    needs: build-and-push
    runs-on: nixos
    steps:
      - uses: actions/checkout@v4

      - name: Assert the image contents
        run: just test-image
