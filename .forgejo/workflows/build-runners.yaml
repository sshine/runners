name: Build runner images

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        run: bash install-nix.sh

      - name: Build runner image
        run: nix build .#nixos-runner

      - name: Load image into Docker
        run: docker load < result

      - name: Log in to Forgejo registry
        run: |
          echo "${{ secrets.FORGEJO_TOKEN }}" | docker login git.shine.town -u forgejo_admin --password-stdin

      - name: Tag and push image
        run: |
          REPO="git.shine.town/infra/runners/nixos"
          TAG="${REPO}:latest"
          IMAGE_ID=$(docker images --quiet --filter "reference=nixos-runner*")
          docker tag "$IMAGE_ID" "$TAG"
          docker push "$TAG"
