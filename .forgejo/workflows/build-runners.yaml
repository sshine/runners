name: Build runner images

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        run: bash install-nix.sh

      - name: Build runner image
        run: nix build .#nixos-runner

      - name: Push image to registry
        run: |
          nix run nixpkgs#skopeo -- copy --dest-creds forgejo_admin:${{ secrets.FORGEJO_TOKEN }} docker-archive:result docker://git.shine.town/infra/runners/nixos:latest
