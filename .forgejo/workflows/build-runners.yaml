name: Build runner images

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        run: .forgejo/scripts/install-nix.sh

      - name: Build runner image
        run: nix build .#nixos-runner -o nixos-runner.tar.gz

      - name: Push image to registry
        run: |
          nix run nixpkgs#skopeo -- copy --insecure-policy --dest-creds forgejo_admin:${{ secrets.RUNNERS_PACKAGE_UPLOAD_KEY }} docker-archive:nixos-runner.tar.gz docker://git.shine.town/infra/runners/nixos:latest
